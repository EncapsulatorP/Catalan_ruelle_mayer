<svg width="100%" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Lyapunov exponents — surjective expanding map (overlap regime) vs Catalan constants</title>
<desc>Surjective expanding maps on [0,1] with two branches that overlap. The coding is surjective but not injective: every real has at least one symbolic preimage, but reals in the overlap region have two. The Pesin λ ≤ h_top ceiling no longer applies, so λ is unbounded above. The achievable region in the (λ, m₁) plane splits topologically at λ = log 2, with G now reachable in the asymmetric corner.</desc>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
<line x1="0" y1="0" x2="0" y2="6" stroke="#5DCAA5" stroke-width="0.7" opacity="0.4"/>
</pattern>
</defs>

<text x="340" y="28" text-anchor="middle" style="font-size:15px;fill:#1F1E1B;font-family:Anthropic Sans, -apple-system, sans-serif;font-weight:500">Surjective coding (overlap regime) — λ along x, m₁ along y</text>
<text x="340" y="48" text-anchor="middle" style="font-size:12px;fill:#5F5E5A;font-family:Anthropic Sans, -apple-system, sans-serif;font-weight:400">Branches overlap: 1/m₁ + 1/m₂ &gt; 1. No Pesin ceiling — λ unbounded. G is now reachable.</text>

