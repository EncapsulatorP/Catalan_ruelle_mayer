<text x="495" y="135" fill="#993556" style="font-size:10px;font-family:Anthropic Sans, sans-serif;font-weight:500">m₁≈5, m₂≈1.25 (mirror)</text>
</g>

<g stroke="#1D9E75" stroke-width="0.5" opacity="0.5" stroke-dasharray="2 3">
<line x1="369.7" y1="0" x2="369.7" y2="320"/>
<text x="365" y="20" fill="#0F6E56" text-anchor="end" transform="rotate(-90 365 20)" style="font-size:9px;font-family:Anthropic Sans, sans-serif">λ = log 2 (region splits here)</text>
</g>

</g>

<g transform="translate(40, 430)">
<rect x="0" y="0" width="600" height="108" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="14" y="20" fill="#2C2C2A" style="font-size:12px;font-family:Anthropic Sans, sans-serif;font-weight:500">Surjective regime — Pesin's λ ≤ h_top ceiling dissolves</text>
<text x="14" y="38" fill="#444441" style="font-size:11px;font-family:Anthropic Sans, sans-serif">Overlapping branches: every real has ≥1 coding, some have 2. SRB structure broken; Pesin's λ_SRB = h_top no longer holds.</text>
<text x="14" y="54" fill="#444441" style="font-size:11px;font-family:Anthropic Sans, sans-serif">Achievable λ-band is now a 2D region (hatched green). Solid green = symmetric m₁=m₂; dashed green = asymmetric corners.</text>
<text x="14" y="70" fill="#444441" style="font-size:11px;font-family:Anthropic Sans, sans-serif">At λ = log 2 the region BIFURCATES: it splits into a thin lower strip (one branch near identity) and an upper strip.</text>
<text x="14" y="86" fill="#444441" style="font-size:11px;font-family:Anthropic Sans, sans-serif">All 5 Catalan constants — including G itself — now lie inside the achievable region. G is reached at m₁≈1.25, m₂≈5.</text>
<text x="14" y="102" fill="#444441" style="font-size:11px;font-family:Anthropic Sans, sans-serif">Caveat: the MME assumes p=1/2 on the full 2-shift; this is a choice, not the only invariant measure on overlapping branches.</text>
</g>

</svg>
