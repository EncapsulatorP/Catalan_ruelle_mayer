<text x="170" y="84" fill="#3C3489" style="font-size:10px;font-family:Anthropic Sans, sans-serif">symmetric boundary (m₁=m₂=2): handoff to bijective</text>
</g>

<g stroke="#185FA5" stroke-width="0.5" opacity="0.7" stroke-dasharray="4 2">
<line x1="338.6" y1="0" x2="338.6" y2="320"/>
<text x="334" y="316" fill="#0C447C" text-anchor="end" transform="rotate(-90 334 316)" style="font-size:10px;font-family:Anthropic Sans, sans-serif">G·log 2 = 0.635 ✓</text>
</g>

<g stroke="#D85A30" stroke-width="0.5" opacity="0.7" stroke-dasharray="4 2">
<line x1="244.3" y1="0" x2="244.3" y2="320"/>
<text x="240" y="316" fill="#993C1D" text-anchor="end" transform="rotate(-90 240 316)" style="font-size:10px;font-family:Anthropic Sans, sans-serif">G/2 = 0.458 ✓</text>
</g>

<g stroke="#7F77DD" stroke-width="0.5" opacity="0.7" stroke-dasharray="4 2">
<line x1="215.6" y1="0" x2="215.6" y2="320"/>
<text x="211" y="316" fill="#3C3489" text-anchor="end" transform="rotate(-90 211 316)" style="font-size:10px;font-family:Anthropic Sans, sans-serif">(2G/π)·log 2 = 0.404 ✓</text>
</g>

<g stroke="#D4537E" stroke-width="0.5" opacity="0.65" stroke-dasharray="4 2">
<line x1="46.8" y1="0" x2="46.8" y2="320"/>
<text x="50" y="316" fill="#993556" transform="rotate(-90 50 316)" style="font-size:10px;font-family:Anthropic Sans, sans-serif">log(1/G) = 0.0878 ✓</text>
</g>

<g stroke="#993556" stroke-width="0.7" opacity="0.9">
<line x1="488.5" y1="0" x2="488.5" y2="320"/>
<text x="484" y="316" fill="#993556" text-anchor="end" transform="rotate(-90 484 316)" style="font-size:10.5px;font-family:Anthropic Sans, sans-serif;font-weight:500">G = 0.916 ✓ now achievable</text>
</g>

<g>
<circle cx="488.5" cy="17.2" r="4" fill="#993556" stroke="#FFF" stroke-width="0.6"/>
<text x="495" y="14" fill="#993556" style="font-size:10px;font-family:Anthropic Sans, sans-serif;font-weight:500">m₁≈1.25, m₂≈5</text>
