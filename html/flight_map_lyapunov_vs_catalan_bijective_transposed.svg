<svg width="100%" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Lyapunov exponents — bijective coding (full Bernoulli), transposed view</title>
<desc>Transposed plot: Lyapunov λ on horizontal axis, multiplier m₁ on vertical axis (log scale). The ceiling λ = log 2 becomes a vertical wall on the right. Catalan-flavored constants appear as vertical lines.</desc>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="340" y="28" text-anchor="middle" style="font-size:15px;fill:#1F1E1B;font-family:Anthropic Sans, -apple-system, sans-serif;font-weight:500">Bijective coding (full Bernoulli) — transposed: λ along x, m₁ along y</text>
<text x="340" y="48" text-anchor="middle" style="font-size:12px;fill:#5F5E5A;font-family:Anthropic Sans, -apple-system, sans-serif;font-weight:400">Achievable λ-band runs left→right. Ceiling λ = log 2 is the vertical right wall. m₁ axis is log-scaled.</text>

<g transform="translate(70, 80)">

<rect x="0" y="0" width="560" height="320" fill="none" stroke="#D3D1C7" stroke-width="0.5"/>

<g stroke="#D3D1C7" stroke-width="0.4" stroke-dasharray="2 3" opacity="0.6">
<line x1="0" y1="40.3" x2="560" y2="40.3"/>
<line x1="0" y1="91.1" x2="560" y2="91.1"/>
<line x1="0" y1="160" x2="560" y2="160"/>
<line x1="0" y1="228.9" x2="560" y2="228.9"/>
<line x1="106.3" y1="0" x2="106.3" y2="320"/>
<line x1="195.2" y1="0" x2="195.2" y2="320"/>
<line x1="284.1" y1="0" x2="284.1" y2="320"/>
<line x1="372.9" y1="0" x2="372.9" y2="320"/>
<line x1="461.9" y1="0" x2="461.9" y2="320"/>
</g>

<g fill="#5F5E5A" font-family="ui-monospace, monospace" font-size="10">
<text x="-8" y="4" text-anchor="end">2</text>
<text x="-8" y="44.3" text-anchor="end">3</text>
<text x="-8" y="95.1" text-anchor="end">5</text>
<text x="-8" y="164" text-anchor="end">10</text>
<text x="-8" y="232.9" text-anchor="end">20</text>
<text x="-8" y="324" text-anchor="end">50</text>
<text x="106.3" y="338" text-anchor="middle">0.2</text>
<text x="195.2" y="338" text-anchor="middle">0.3</text>
<text x="284.1" y="338" text-anchor="middle">0.4</text>
<text x="372.9" y="338" text-anchor="middle">0.5</text>
<text x="461.9" y="338" text-anchor="middle">0.6</text>
</g>

<text x="-44" y="160" transform="rotate(-90 -44 160)" text-anchor="middle" style="font-size:12px;fill:#5F5E5A;font-family:Anthropic Sans, sans-serif">multiplier m₁ (log scale, m₂ = m₁/(m₁−1))</text>
<text x="280" y="362" text-anchor="middle" style="font-size:12px;fill:#5F5E5A;font-family:Anthropic Sans, sans-serif">Lyapunov λ</text>

<g stroke="#1D9E75" stroke-width="0.8" opacity="0.85">
<line x1="545" y1="0" x2="545" y2="320"/>
<text x="540" y="316" fill="#0F6E56" text-anchor="end" transform="rotate(-90 540 316)" style="font-size:10px;font-family:Anthropic Sans, sans-serif">λ = log 2 = 0.693 (ceiling, m₁=2)</text>
</g>

<g stroke="#185FA5" stroke-width="0.5" opacity="0.7" stroke-dasharray="4 2">
<line x1="493.2" y1="0" x2="493.2" y2="320"/>
<text x="489" y="316" fill="#0C447C" text-anchor="end" transform="rotate(-90 489 316)" style="font-size:10px;font-family:Anthropic Sans, sans-serif">G·log 2 = 0.635 ✓</text>
</g>

<g stroke="#D85A30" stroke-width="0.5" opacity="0.7" stroke-dasharray="4 2">
<line x1="336" y1="0" x2="336" y2="320"/>
<text x="332" y="316" fill="#993C1D" text-anchor="end" transform="rotate(-90 332 316)" style="font-size:10px;font-family:Anthropic Sans, sans-serif">G/2 = 0.458 ✓</text>
</g>

<g stroke="#7F77DD" stroke-width="0.5" opacity="0.7" stroke-dasharray="4 2">
<line x1="288.2" y1="0" x2="288.2" y2="320"/>
<text x="284" y="316" fill="#3C3489" text-anchor="end" transform="rotate(-90 284 316)" style="font-size:10px;font-family:Anthropic Sans, sans-serif">(2G/π)·log 2 = 0.404 ✓</text>
</g>

<g stroke="#D4537E" stroke-width="0.5" opacity="0.65" stroke-dasharray="4 2">
<line x1="6.9" y1="0" x2="6.9" y2="320"/>
<text x="11" y="316" fill="#993556" transform="rotate(-90 11 316)" style="font-size:10px;font-family:Anthropic Sans, sans-serif">log(1/G) = 0.0878 ✓</text>
</g>

<g stroke="#A32D2D" stroke-width="0.6" opacity="0.5" stroke-dasharray="2 4">
<line x1="585" y1="0" x2="585" y2="320"/>
<text x="580" y="316" fill="#A32D2D" text-anchor="end" transform="rotate(-90 580 316)" style="font-size:10px;font-family:Anthropic Sans, sans-serif">G = 0.916 ✗ above ceiling (off-chart right)</text>
</g>

<path d="M 545.0,0.0 L 543.8,5.4 L 540.3,10.8 L 534.8,16.3 L 527.8,21.7 L 519.4,27.1 L 509.9,32.5 L 499.5,38.0 L 488.2,43.4 L 476.3,48.8 L 463.9,54.2 L 451.2,59.7 L 438.1,65.1 L 424.8,70.5 L 411.4,75.9 L 397.9,81.4 L 384.4,86.8 L 370.9,92.2 L 357.6,97.6 L 344.3,103.1 L 331.2,108.5 L 318.2,113.9 L 305.5,119.3 L 293.0,124.7 L 280.7,130.2 L 268.7,135.6 L 256.9,141.0 L 245.4,146.4 L 234.2,151.9 L 223.2,157.3 L 212.6,162.7 L 202.2,168.1 L 192.1,173.6 L 182.3,179.0 L 172.8,184.4 L 163.6,189.8 L 154.7,195.3 L 146.0,200.7 L 137.6,206.1 L 129.5,211.5 L 121.7,216.9 L 114.1,222.4 L 106.8,227.8 L 99.7,233.2 L 92.9,238.6 L 86.3,244.1 L 80.0,249.5 L 73.9,254.9 L 68.0,260.3 L 62.3,265.8 L 56.8,271.2 L 51.6,276.6 L 46.5,282.0 L 41.6,287.5 L 36.9,292.9 L 32.4,298.3 L 28.1,303.7 L 23.9,309.2 L 19.9,314.6 L 16.0,320.0" fill="none" stroke="#3C3489" stroke-width="1.6"/>

<g>
<circle cx="545" cy="0" r="3.5" fill="#3C3489"/>
<circle cx="545" cy="0" r="1.3" fill="#FFFFFF"/>
<line x1="545" y1="0" x2="510" y2="30" stroke="#3C3489" stroke-width="0.6"/>
<text x="395" y="34" fill="#3C3489" style="font-size:10px;font-family:Anthropic Sans, sans-serif">m₁=m₂=2, peak (top-right corner)</text>
</g>

</g>

<g transform="translate(40, 430)">
<rect x="0" y="0" width="600" height="92" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="14" y="20" fill="#0F6E56" style="font-size:12px;font-family:Anthropic Sans, sans-serif;font-weight:500">Bijective regime — λ-band runs left→right</text>
<text x="14" y="38" fill="#085041" style="font-size:11px;font-family:Anthropic Sans, sans-serif">Curve enters top-right corner (m₁=2, λ=log 2) and sweeps down-left as m₁ grows.</text>
<text x="14" y="54" fill="#085041" style="font-size:11px;font-family:Anthropic Sans, sans-serif">Catalan constants are now vertical lines. A constant is "inside" iff its vertical line crosses the curve.</text>
<text x="14" y="70" fill="#085041" style="font-size:11px;font-family:Anthropic Sans, sans-serif">4 of 5 Catalan constants cross the curve at some finite m₁; G alone sits past the right wall.</text>
<text x="14" y="86" fill="#085041" style="font-size:11px;font-family:Anthropic Sans, sans-serif">log(1/G) now visible inside the band — the long m₁ tail covers it (it sat off-chart in the y-view).</text>
</g>

</svg>
