<svg width="100%" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Lyapunov exponents — bijective coding (full Bernoulli) vs Catalan constants</title>
<desc>Lyapunov exponent of a 2-branch full-Markov expanding map whose itinerary coding is a measure-theoretic bijection onto [0,1] (full Bernoulli shift on two symbols). Topological entropy is log 2. Catalan-flavored constants are overlaid showing which fall inside the achievable λ-range.</desc>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="340" y="28" text-anchor="middle" style="font-size:15px;fill:#1F1E1B;font-family:Anthropic Sans, -apple-system, sans-serif;font-weight:500">Bijective coding (full Bernoulli shift) — λ vs Catalan constants</text>
<text x="340" y="48" text-anchor="middle" style="font-size:12px;fill:#5F5E5A;font-family:Anthropic Sans, -apple-system, sans-serif;font-weight:400">Σ₂ → [0,1] is a measure-theoretic bijection. Transition matrix A=[[1,1],[1,1]]. h_top = log 2 ≈ 0.693.</text>

<g transform="translate(70, 80)">

<rect x="0" y="0" width="560" height="320" fill="none" stroke="#D3D1C7" stroke-width="0.5"/>

<g stroke="#D3D1C7" stroke-width="0.4" stroke-dasharray="2 3" opacity="0.6">
<line x1="0" y1="0" x2="560" y2="0"/>
<line x1="0" y1="60" x2="560" y2="60"/>
<line x1="0" y1="120" x2="560" y2="120"/>
<line x1="0" y1="180" x2="560" y2="180"/>
<line x1="0" y1="240" x2="560" y2="240"/>
<line x1="0" y1="300" x2="560" y2="300"/>
<line x1="100" y1="0" x2="100" y2="320"/>
<line x1="200" y1="0" x2="200" y2="320"/>
<line x1="300" y1="0" x2="300" y2="320"/>
<line x1="400" y1="0" x2="400" y2="320"/>
<line x1="500" y1="0" x2="500" y2="320"/>
</g>

<g fill="#5F5E5A" font-family="ui-monospace, monospace" font-size="10">
<text x="-8" y="4" text-anchor="end">0.7</text>
<text x="-8" y="64" text-anchor="end">0.6</text>
<text x="-8" y="124" text-anchor="end">0.5</text>
<text x="-8" y="184" text-anchor="end">0.4</text>
<text x="-8" y="244" text-anchor="end">0.3</text>
<text x="-8" y="304" text-anchor="end">0.2</text>
<text x="0" y="338" text-anchor="middle">2</text>
<text x="100" y="338" text-anchor="middle">10</text>
<text x="200" y="338" text-anchor="middle">20</text>
<text x="300" y="338" text-anchor="middle">30</text>
<text x="400" y="338" text-anchor="middle">40</text>
<text x="500" y="338" text-anchor="middle">50</text>
</g>

<text x="-40" y="160" transform="rotate(-90 -40 160)" text-anchor="middle" style="font-size:12px;fill:#5F5E5A;font-family:Anthropic Sans, sans-serif">Lyapunov λ</text>
<text x="280" y="362" text-anchor="middle" style="font-size:12px;fill:#5F5E5A;font-family:Anthropic Sans, sans-serif">multiplier m₁ (m₂ = m₁/(m₁−1) by full-Markov constraint)</text>

<g stroke="#1D9E75" stroke-width="0.8" opacity="0.85">
<line x1="0" y1="4" x2="560" y2="4"/>
<text x="544" y="-2" fill="#0F6E56" text-anchor="end" style="font-size:10px;font-family:Anthropic Sans, sans-serif">λ_max = log 2 = 0.693 (h_top, peak at m₁=2)</text>
</g>

<g stroke="#185FA5" stroke-width="0.5" opacity="0.7" stroke-dasharray="4 2">
<line x1="0" y1="39" x2="560" y2="39"/>
<text x="6" y="34" fill="#0C447C" style="font-size:10px;font-family:Anthropic Sans, sans-serif">G·log 2 = 0.635  ✓ inside</text>
</g>

<g stroke="#D85A30" stroke-width="0.5" opacity="0.7" stroke-dasharray="4 2">
<line x1="0" y1="145" x2="560" y2="145"/>
<text x="6" y="140" fill="#993C1D" style="font-size:10px;font-family:Anthropic Sans, sans-serif">G/2 = 0.458  ✓ inside</text>
</g>

<g stroke="#7F77DD" stroke-width="0.5" opacity="0.7" stroke-dasharray="4 2">
<line x1="0" y1="177" x2="560" y2="177"/>
<text x="6" y="172" fill="#3C3489" style="font-size:10px;font-family:Anthropic Sans, sans-serif">(2G/π)·log 2 = 0.404  ✓ inside</text>
</g>

<g stroke="#A32D2D" stroke-width="0.6" opacity="0.5" stroke-dasharray="2 4">
<line x1="0" y1="-30" x2="560" y2="-30"/>
<text x="544" y="-36" fill="#A32D2D" text-anchor="end" style="font-size:10px;font-family:Anthropic Sans, sans-serif">G ≈ 0.916  ✗ above ceiling (off-chart)</text>
<line x1="0" y1="368" x2="560" y2="368"/>
<text x="544" y="376" fill="#A32D2D" text-anchor="end" style="font-size:10px;font-family:Anthropic Sans, sans-serif">log(1/G) ≈ 0.0878  ✗ below tail (off-chart)</text>
</g>

<path d="M 0,4 L 11,36 L 22,79 L 34,116 L 45,145 L 56,169 L 67,189 L 78,206 L 90,221 L 101,233 L 112,244 L 123,253 L 134,262 L 146,269 L 157,276 L 168,282 L 179,288 L 190,293 L 202,298 L 213,302 L 224,306 L 235,310 L 246,313 L 258,316 L 269,319 L 280,322 L 291,325 L 302,327 L 314,330 L 325,332 L 336,334 L 347,336 L 358,338 L 370,340 L 381,342 L 392,343 L 403,345 L 414,346 L 426,348 L 437,349 L 448,350 L 459,352 L 470,353 L 482,354 L 493,355 L 504,356 L 515,357 L 526,358 L 538,359 L 549,360 L 560,361" fill="none" stroke="#3C3489" stroke-width="1.6"/>

<g>
<circle cx="0" cy="4" r="3.5" fill="#3C3489"/>
<circle cx="0" cy="4" r="1.3" fill="#FFFFFF"/>
<line x1="0" y1="4" x2="50" y2="22" stroke="#3C3489" stroke-width="0.6"/>
<text x="54" y="26" fill="#3C3489" style="font-size:10px;font-family:Anthropic Sans, sans-serif">m₁=m₂=2, peak (Bernoulli ½,½)</text>
</g>

</g>

<g transform="translate(40, 430)">
<rect x="0" y="0" width="600" height="92" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="14" y="20" fill="#0F6E56" style="font-size:12px;font-family:Anthropic Sans, sans-serif;font-weight:500">Bijective regime</text>
<text x="14" y="38" fill="#085041" style="font-size:11px;font-family:Anthropic Sans, sans-serif">Coding π: Σ₂ → [0,1] sends infinite binary words to reals — measure-theoretic bijection mod a null set.</text>
<text x="14" y="54" fill="#085041" style="font-size:11px;font-family:Anthropic Sans, sans-serif">Achievable λ-range: (0, log 2]. Three Catalan constants (G·log 2, G/2, (2G/π)·log 2) sit inside the band.</text>
<text x="14" y="70" fill="#085041" style="font-size:11px;font-family:Anthropic Sans, sans-serif">G itself overshoots the ceiling; log(1/G) lies below the band's tail (no finite m₁ reaches it from above).</text>
<text x="14" y="86" fill="#085041" style="font-size:11px;font-family:Anthropic Sans, sans-serif">3 of 5 Catalan constants fall inside the achievable range.</text>
</g>

</svg>
