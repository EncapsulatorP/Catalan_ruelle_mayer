<svg width="100%" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Lyapunov exponents — injective coding (golden-mean SFT) vs Catalan constants</title>
<desc>Lyapunov exponent of a 2-branch piecewise-linear Markov map whose itinerary coding is injective onto a Cantor-set invariant subset of [0,1] — a subshift of finite type with the golden-mean transition matrix forbidding the symbol pair 11. Topological entropy collapses to log φ. Catalan-flavored constants are overlaid; the ceiling drop expels two more constants from the achievable range.</desc>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="340" y="28" text-anchor="middle" style="font-size:15px;fill:#1F1E1B;font-family:Anthropic Sans, -apple-system, sans-serif;font-weight:500">Injective coding (golden-mean SFT) — λ vs Catalan constants</text>
<text x="340" y="48" text-anchor="middle" style="font-size:12px;fill:#5F5E5A;font-family:Anthropic Sans, -apple-system, sans-serif;font-weight:400">Σ_A → [0,1] is injective onto a Cantor invariant set, not surjective. A=[[1,1],[1,0]] forbids 11. h_top = log φ ≈ 0.481.</text>

<g transform="translate(70, 80)">

<rect x="0" y="0" width="560" height="320" fill="none" stroke="#D3D1C7" stroke-width="0.5"/>

<g stroke="#D3D1C7" stroke-width="0.4" stroke-dasharray="2 3" opacity="0.6">
<line x1="0" y1="0" x2="560" y2="0"/>
<line x1="0" y1="75" x2="560" y2="75"/>
<line x1="0" y1="150" x2="560" y2="150"/>
<line x1="0" y1="225" x2="560" y2="225"/>
<line x1="0" y1="300" x2="560" y2="300"/>
<line x1="100" y1="0" x2="100" y2="320"/>
<line x1="200" y1="0" x2="200" y2="320"/>
<line x1="300" y1="0" x2="300" y2="320"/>
<line x1="400" y1="0" x2="400" y2="320"/>
<line x1="500" y1="0" x2="500" y2="320"/>
</g>

<g fill="#5F5E5A" font-family="ui-monospace, monospace" font-size="10">
<text x="-8" y="4" text-anchor="end">0.5</text>
<text x="-8" y="79" text-anchor="end">0.4</text>
<text x="-8" y="154" text-anchor="end">0.3</text>
<text x="-8" y="229" text-anchor="end">0.2</text>
<text x="-8" y="304" text-anchor="end">0.1</text>
<text x="0" y="338" text-anchor="middle">φ</text>
<text x="100" y="338" text-anchor="middle">10</text>
<text x="200" y="338" text-anchor="middle">20</text>
<text x="300" y="338" text-anchor="middle">30</text>
<text x="400" y="338" text-anchor="middle">40</text>
<text x="500" y="338" text-anchor="middle">50</text>
</g>

<text x="-40" y="160" transform="rotate(-90 -40 160)" text-anchor="middle" style="font-size:12px;fill:#5F5E5A;font-family:Anthropic Sans, sans-serif">Lyapunov λ</text>
<text x="280" y="362" text-anchor="middle" style="font-size:12px;fill:#5F5E5A;font-family:Anthropic Sans, sans-serif">multiplier m₁ (m₂ = 1/(m₁−1) by SFT-Markov constraint)</text>

<g stroke="#1D9E75" stroke-width="0.8" opacity="0.85">
<line x1="0" y1="14" x2="560" y2="14"/>
<text x="544" y="8" fill="#0F6E56" text-anchor="end" style="font-size:10px;font-family:Anthropic Sans, sans-serif">λ_max = log φ = 0.481 (h_top, peak at m₁=φ, symmetric Parry case)</text>
</g>

<g stroke="#D85A30" stroke-width="0.5" opacity="0.7" stroke-dasharray="4 2">
<line x1="0" y1="32" x2="560" y2="32"/>
<text x="6" y="27" fill="#993C1D" style="font-size:10px;font-family:Anthropic Sans, sans-serif">G/2 = 0.458  ✓ inside (barely — squeezed against ceiling)</text>
</g>

<g stroke="#7F77DD" stroke-width="0.5" opacity="0.7" stroke-dasharray="4 2">
<line x1="0" y1="72" x2="560" y2="72"/>
<text x="6" y="67" fill="#3C3489" style="font-size:10px;font-family:Anthropic Sans, sans-serif">(2G/π)·log 2 = 0.404  ✓ inside</text>
</g>

<g stroke="#A32D2D" stroke-width="0.6" opacity="0.5" stroke-dasharray="2 4">
<line x1="0" y1="-50" x2="560" y2="-50"/>
<text x="544" y="-56" fill="#A32D2D" text-anchor="end" style="font-size:10px;font-family:Anthropic Sans, sans-serif">G ≈ 0.916, log 2 ≈ 0.693, G·log 2 ≈ 0.635 — all ✗ above new ceiling (off-chart)</text>
<line x1="0" y1="368" x2="560" y2="368"/>
<text x="544" y="376" fill="#A32D2D" text-anchor="end" style="font-size:10px;font-family:Anthropic Sans, sans-serif">log(1/G) ≈ 0.0878  ✗ below tail (off-chart)</text>
</g>

<path d="M 0,14 L 11,65 L 22,116 L 34,152 L 45,179 L 56,200 L 67,216 L 78,229 L 90,240 L 101,250 L 112,258 L 123,265 L 134,271 L 146,276 L 157,281 L 168,285 L 179,289 L 190,292 L 202,296 L 213,299 L 224,301 L 235,304 L 246,306 L 258,308 L 269,310 L 280,312 L 291,314 L 302,316 L 314,317 L 325,319 L 336,320 L 347,322 L 358,323 L 370,324 L 381,325 L 392,326 L 403,327 L 414,328 L 426,329 L 437,330 L 448,331 L 459,332 L 470,333 L 482,333 L 493,334 L 504,335 L 515,335 L 526,336 L 538,337 L 549,337 L 560,338" fill="none" stroke="#3C3489" stroke-width="1.6"/>

<g>
<circle cx="0" cy="14" r="3.5" fill="#3C3489"/>
<circle cx="0" cy="14" r="1.3" fill="#FFFFFF"/>
<line x1="0" y1="14" x2="60" y2="40" stroke="#3C3489" stroke-width="0.6"/>
<text x="64" y="44" fill="#3C3489" style="font-size:10px;font-family:Anthropic Sans, sans-serif">m₁=m₂=φ, peak (Parry measure)</text>
</g>

</g>

<g transform="translate(40, 430)">
<rect x="0" y="0" width="600" height="92" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
<text x="14" y="20" fill="#854F0B" style="font-size:12px;font-family:Anthropic Sans, sans-serif;font-weight:500">Injective regime — the ceiling drops by log(2/φ) ≈ 0.212</text>
<text x="14" y="38" fill="#633806" style="font-size:11px;font-family:Anthropic Sans, sans-serif">Coding Σ_A → [0,1] is injective but lands in a Cantor invariant subset — the SFT forbids transition 11.</text>
<text x="14" y="54" fill="#633806" style="font-size:11px;font-family:Anthropic Sans, sans-serif">Achievable λ-range: (0, log φ]. Only 2 of 5 Catalan constants stay inside; G·log 2 has been expelled.</text>
<text x="14" y="70" fill="#633806" style="font-size:11px;font-family:Anthropic Sans, sans-serif">The ceiling itself is now log φ — a non-trivial algebraic number, not just log 2 / log 3 / log of an integer.</text>
<text x="14" y="86" fill="#633806" style="font-size:11px;font-family:Anthropic Sans, sans-serif">This is the right ambient for "Catalan as L-value meets dynamical zeta" comparisons (β(2), Selberg zeta on SFTs).</text>
</g>

</svg>
